[workspace]
resolver = "3"
members = [



    "crates/amla-protocol",
    "crates/amla-protocol-capabilities",
    "crates/amla-protocol-constraints",

    "crates/amla-sandbox",
    "crates/amla-sandbox-audit",
    "crates/amla-sandbox-js",
    "crates/amla-sandbox-scheduler",
    "crates/amla-sandbox-shell",
    "crates/amla-sandbox-tools",
    "crates/amla-sandbox-vfs",

]
[workspace.package]
# Placeholder. The real release version is injected at extract time by
# scripts/extract-mirror.py (driven by the release-vX.Y.Z tag).
# See mirrors/README.md for the release flow.
version = "0.2.7"
edition = "2024"
license = "AGPL-3.0-or-later OR BUSL-1.1"
authors = ["Amla Labs <hi@amlalabs.com>"]

# ============================================================================
# Workspace dependencies (merged from all former workspaces)
# ============================================================================

[workspace.dependencies]



amla-protocol = { path = "crates/amla-protocol" }
amla-protocol-capabilities = { path = "crates/amla-protocol-capabilities" }
amla-protocol-constraints = { path = "crates/amla-protocol-constraints" }

amla-sandbox = { path = "crates/amla-sandbox" }
amla-sandbox-audit = { path = "crates/amla-sandbox-audit" }
amla-sandbox-js = { path = "crates/amla-sandbox-js" }
amla-sandbox-scheduler = { path = "crates/amla-sandbox-scheduler" }
amla-sandbox-shell = { path = "crates/amla-sandbox-shell" }
amla-sandbox-tools = { path = "crates/amla-sandbox-tools" }
amla-sandbox-vfs = { path = "crates/amla-sandbox-vfs" }

tokio = { version = "1.43", features = ["full", "parking_lot"] }
tokio-util = "0.7"
async-trait = "0.1"
trait-variant = "0.1"
futures = "0.3"
futures-util = "0.3"

crossbeam = "0.8"
parking_lot = "0.12"
event-listener = "5.4"

thiserror = "2.0"

log = "0.4"
env_logger = "0.11"
console-subscriber = "0.4"
tracing = "0.1"
tracing-subscriber = "0.3"

serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
postcard = { version = "1.0", features = ["alloc"] }
ciborium = "0.2"
toml = "0.8"

bytemuck = { version = "1.21", features = ["derive", "min_const_generics"] }

nonmax = "0.5"

smallvec = "1.13"

libc = "0.2"
rustix = "1.0"

kvm-ioctls = "0.19"
kvm-bindings = { version = "0.10", features = ["fam-wrappers"] }

axum = { version = "0.8", features = ["ws"] }
reqwest = { version = "0.12", default-features = false, features = ["json"] }
