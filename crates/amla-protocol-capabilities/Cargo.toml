[package]
name = "amla-protocol-capabilities"
description = "Capability types for AI agent sandboxing (tool calls, memory access, spawn)"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true

[lib]
name = "amla_capabilities"
crate-type = ["cdylib", "rlib"]

[features]
default = []
# WASM bindings for browser/node integration
wasm = ["dep:wasm-bindgen", "dep:js-sys", "dep:serde-wasm-bindgen"]

[dependencies]
amla-protocol-constraints.workspace = true
amla-protocol.workspace = true
serde = { workspace = true, features = ["derive"] }
serde_json.workspace = true
thiserror.workspace = true

# Wasm support (optional)
wasm-bindgen = { workspace = true, optional = true }
js-sys = { workspace = true, optional = true }
serde-wasm-bindgen = { workspace = true, optional = true }

[target.'cfg(not(target_arch = "wasm32"))'.dev-dependencies]
proptest.workspace = true

# cargo-machete can't detect WASM-specific/feature-gated dependencies
[package.metadata.cargo-machete]
ignored = ["js-sys", "serde-wasm-bindgen"]

[lints.rust]
unsafe_op_in_unsafe_fn = "deny"

[lints.clippy]
all = { level = "deny", priority = -1 }
pedantic = { level = "deny", priority = -2 }
style = { level = "deny", priority = -2 }
module_name_repetitions = "allow"
must_use_candidate = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
