[package]
name = "amla-protocol-constraints"
description = "Constraint system for capability enforcement - conjunction-only with fail-closed semantics"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true

[lib]
name = "amla_constraints"
crate-type = ["cdylib", "rlib"]

[dependencies]
serde = { workspace = true, features = ["derive"] }
serde_json.workspace = true
thiserror.workspace = true

[target.'cfg(not(target_arch = "wasm32"))'.dev-dependencies]
proptest.workspace = true

[lints.rust]
unsafe_op_in_unsafe_fn = "deny"

[lints.clippy]
all = { level = "deny", priority = -1 }
pedantic = { level = "deny", priority = -2 }
style = { level = "deny", priority = -2 }
module_name_repetitions = "allow"
must_use_candidate = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
