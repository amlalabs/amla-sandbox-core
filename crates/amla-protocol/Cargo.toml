[package]
name = "amla-protocol"
description = "Core protocol types for Amla capability-based authorization"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true

[features]
default = []
# WASM bindings for browser/node integration
wasm = ["dep:wasm-bindgen", "dep:js-sys", "dep:serde-wasm-bindgen"]

[dependencies]
# Serialization
ciborium.workspace = true
serde.workspace = true
serde_json.workspace = true

# Cryptography
ed25519-dalek.workspace = true
sha2.workspace = true

# Time
chrono.workspace = true

# Error handling
thiserror.workspace = true

# Wasm support (optional)
wasm-bindgen = { workspace = true, optional = true }
js-sys = { workspace = true, optional = true }
serde-wasm-bindgen = { workspace = true, optional = true }

# Hex encoding
hex.workspace = true

# Serde utilities
serde_bytes.workspace = true

# Security: zeroize secret keys on drop
zeroize.workspace = true

[dev-dependencies]
wasm-bindgen-test.workspace = true

[target.'cfg(not(target_arch = "wasm32"))'.dev-dependencies]
proptest.workspace = true

# cargo-machete can't detect WASM-specific/feature-gated dependencies
[package.metadata.cargo-machete]
ignored = ["js-sys"]

[lints.rust]
unsafe_op_in_unsafe_fn = "deny"

[lints.clippy]
all = { level = "deny", priority = -1 }
pedantic = { level = "deny", priority = -2 }
style = { level = "deny", priority = -2 }
module_name_repetitions = "allow"
must_use_candidate = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
