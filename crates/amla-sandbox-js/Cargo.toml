[package]
name = "amla-sandbox-js"
description = "JavaScript runtime for AI agent sandboxing with async operation support"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true

[lib]
name = "amla_js"
crate-type = ["cdylib", "rlib"]

[features]
default = []

[dependencies]
serde = { workspace = true, features = ["derive"] }
serde_json.workspace = true
thiserror.workspace = true

# UUID and chrono - only use on non-WASM platforms
# (WASM uses host-provided time/random)
[target.'cfg(not(all(target_arch = "wasm32", target_os = "unknown")))'.dependencies]
uuid = { workspace = true, features = ["v4"] }
chrono = { workspace = true }

[build-dependencies]
cc.workspace = true

# Don't inherit workspace lints - we need unsafe for QuickJS FFI
[lints.rust]
# FFI requires unsafe code - allow it in this crate
unsafe_code = "allow"
missing_docs = "warn"

[dev-dependencies]
criterion = { workspace = true, features = ["html_reports"] }

[[bench]]
name = "js_runtime"
harness = false

[lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
missing_errors_doc = "allow"
missing_panics_doc = "allow"
must_use_candidate = "allow"
# Test code style lints - allow for readability in test strings
unreadable_literal = "allow"
needless_raw_string_hashes = "allow"
