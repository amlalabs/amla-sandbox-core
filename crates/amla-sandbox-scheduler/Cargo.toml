[package]
name = "amla-sandbox-scheduler"
description = "Single-threaded async executor for WASM-compatible shell execution"
version.workspace = true
edition.workspace = true
license.workspace = true

[lib]
name = "amla_scheduler"

[features]
default = []
# Enable randomized scheduling for bug finding via fuzzing.
# When enabled, tasks are selected randomly from the ready queue
# instead of FIFO order, exposing race conditions and timing bugs.
random-scheduling = ["dep:fastrand"]

[dependencies]
smallvec.workspace = true
fastrand = { workspace = true, optional = true }

[dev-dependencies]
wasm-bindgen-test.workspace = true
criterion.workspace = true
tracking-allocator.workspace = true

[[bench]]
name = "scheduler_bench"
harness = false

[target.'cfg(target_arch = "wasm32")'.dev-dependencies]
wasm-bindgen.workspace = true

# Can't use workspace lints because we need to allow unsafe_code
# for custom waker implementation
[lints.rust]
unsafe_code = "allow"
missing_docs = "deny"

[lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
missing_errors_doc = "allow"
missing_panics_doc = "allow"
must_use_candidate = "allow"
