[package]
name = "amla-sandbox-shell"
version = "0.1.0"
edition.workspace = true
description = "Shell for AI agent sandboxing"
license.workspace = true

[lib]
name = "amla_shell"

[features]
# Enable panic command for testing panic recovery in dependent crates
test-panic = []

[dependencies]
amla-sandbox-js.workspace = true
amla-sandbox-scheduler.workspace = true
amla-sandbox-tools.workspace = true
amla-sandbox-vfs.workspace = true
base64.workspace = true
jaq-core.workspace = true
jaq-std.workspace = true
jaq-interpret.workspace = true
jaq-parse.workspace = true
lexopt.workspace = true
serde_json.workspace = true
smallvec = { workspace = true, features = ["const_generics"] }
thiserror.workspace = true

[dev-dependencies]
pollster.workspace = true

[lints.rust]
unsafe_code = "forbid"
missing_docs = "allow"  # Shell is internal, docs not critical
unused_must_use = "allow"  # Tests often ignore scheduler::run() result

[lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
missing_errors_doc = "allow"
missing_panics_doc = "allow"
must_use_candidate = "allow"
# Shell-specific allows
too_many_arguments = "allow"
manual_strip = "allow"
should_implement_trait = "allow"
if_same_then_else = "allow"
inconsistent_digit_grouping = "allow"
unreadable_literal = "allow"
similar_names = "allow"
match_same_arms = "allow"
unnecessary_wraps = "allow"
needless_pass_by_value = "allow"
cast_sign_loss = "allow"
format_push_string = "allow"
manual_let_else = "allow"
single_match_else = "allow"
match_wildcard_for_single_variants = "allow"
unnested_or_patterns = "allow"
needless_raw_string_hashes = "allow"
doc_markdown = "allow"
map_unwrap_or = "allow"
redundant_closure_for_method_calls = "allow"
too_many_lines = "allow"
struct_excessive_bools = "allow"
fn_params_excessive_bools = "allow"
cast_precision_loss = "allow"
assigning_clones = "allow"
unused_async = "allow"
format_collect = "allow"
